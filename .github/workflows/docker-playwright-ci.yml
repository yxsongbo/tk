name: Docker Playwright CI

on:
  push:
  pull_request:

jobs:
  docker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t tk-practice-test .

      - name: Run tests in Docker
        run: |
          docker run --rm tk-practice-test
