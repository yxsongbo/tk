                    })
                });
                const loginResult = await loginResponse.json();
                if (!loginResponse.ok) {
                    throw new Error(loginResult.detail || '准考证号或姓名错误');
                }
                
                // 登录成功，跳转到智能练习页面
                localStorage.setItem('student_id', String(loginResult.id));
                window.location.href = `/xx/smart-practice?student_id=${loginResult.id}`;
            } catch (error) {
                errorDiv.textContent = error.message || '登录失败，请重试';
                errorDiv.classList.remove('hidden');
            } finally {
                isStartingPractice = false;
                startBtn.disabled = false;
                startBtn.textContent = '开始练习';
            }
        });

        function recomputeTotalScore() {
            totalScore = Object.values(answers).reduce((sum, item) => sum + (Number(item && item.score) || 0), 0);
        }

        function mergeQuestionDetail(index, detail) {
            if (index < 0 || index >= questions.length || !detail) return;
            questions[index] = {
                ...questions[index],
                ...detail,
                loaded: true,
                loading: false
            };
        }

        async function fetchQuestionDetail(index) {
            if (index < 0 || index >= questions.length) return;
            const question = questions[index];
            if (!question || question.loaded || question.loading) return;

            question.loading = true;
            if (index === currentQuestionIndex) {
                const container = document.getElementById('questionContainer');
                if (container) {
                    container.innerHTML = '<div class="question-card">题目加载中...</div>';
                }
            }

            try {
                const examParam = currentExamFilename ? `?exam_filename=${encodeURIComponent(currentExamFilename)}` : '';
                const response = await fetch(`${API_BASE}/questions/${encodeURIComponent(question.id)}${examParam}`);
                if (!response.ok) throw new Error('load question failed');
                const detail = await response.json();
                mergeQuestionDetail(index, detail);
            } catch (error) {
                question.loading = false;
                if (index === currentQuestionIndex) {
                    const container = document.getElementById('questionContainer');
                    if (container) {
                        container.innerHTML = '<div class="question-card">题目加载失败，请稍后重试。</div>';
                    }
                }
                return;
            }

            if (index === currentQuestionIndex) {
                renderQuestion();
            }
        }

        function prefetchNextQuestion(index) {
            const nextIndex = index + 1;
            if (nextIndex < 0 || nextIndex >= questions.length) return;
            fetchQuestionDetail(nextIndex);
        }

        function getStudyNoteKey(question) {
            return String(question && question.question ? question.question : '').trim();
        }

        function getStudyNoteContent(note) {
            const content = String(note && note.thinking ? note.thinking : '').trim();
            if (content) return content;

            const knowledgePoints = String(note && note.knowledge_points ? note.knowledge_points : '').trim();
            return knowledgePoints;
        }

        function ensureStudyNoteDraft(question) {
            const key = getStudyNoteKey(question);
            if (!key) return { content: '' };
            if (!studyNoteDrafts[key]) {
                const state = studyNotesByQuestionText[key];
                const ownNote = state && Array.isArray(state.notes) ? state.notes.find(note => note.is_own) : null;
                studyNoteDrafts[key] = {
                    content: ownNote ? getStudyNoteContent(ownNote) : ''
                };
            }
            return studyNoteDrafts[key];
        }

        function updateStudyNoteDraft(value) {
            const question = questions[currentQuestionIndex];
            if (!question) return;
            const draft = ensureStudyNoteDraft(question);
            draft.content = value;
            const saveButton = document.getElementById('saveStudyNoteBtn');
            if (saveButton) {
                const canSave = !isSavingStudyNote && !!String(draft.content || '').trim();
                saveButton.disabled = !canSave;
            }
        }

        async function loadStudyNotesForQuestion(question) {
            if (!question || examMode !== 'practice' || !currentStudentId) return;

            const key = getStudyNoteKey(question);
            if (!key) return;

            const currentState = studyNotesByQuestionText[key];
            if (currentState && (currentState.loading || currentState.loaded)) return;

            studyNotesByQuestionText[key] = { loading: true, loaded: false, notes: [] };
            try {
                const response = await fetch(`${API_BASE}/notes?question_text=${encodeURIComponent(key)}&current_student_id=${currentStudentId}`);
                if (!response.ok) throw new Error('load notes failed');
                const result = await response.json();
                studyNotesByQuestionText[key] = {
                    loading: false,
                    loaded: true,
                    notes: Array.isArray(result.notes) ? result.notes : []
                };
                ensureStudyNoteDraft(question);
            } catch (error) {
                studyNotesByQuestionText[key] = { loading: false, loaded: true, notes: [] };
            }

            const currentQuestion = questions[currentQuestionIndex];
            if (currentQuestion && getStudyNoteKey(currentQuestion) === key) {
                renderQuestion();
            }
        }

        function buildStudyNotesHtml(question) {
            if (!question || examMode !== 'practice') return '';
            const answerData = answers[question.id];
            if (!answerData || !answerData.submitted) return '';

            const key = getStudyNoteKey(question);
            const noteState = studyNotesByQuestionText[key] || { loading: false, loaded: false, notes: [] };
            const draft = ensureStudyNoteDraft(question);
            const ownNote = noteState.notes.find(note => note.is_own);
            const saveDisabled = isSavingStudyNote || !String(draft.content || '').trim();
            const encouragement = ownNote && Number(ownNote.like_count || 0) > 0
                ? `这条复盘已获得 ${ownNote.like_count} 个赞，继续保持。`
                : '写下本题用到的知识点、答题思路，或指出题目、答案、解析中的问题和你的评价。';

            let listHtml = '<div class="study-note-empty">暂时还没有同题复盘，先写下你的思路吧。</div>';
            if (noteState.loading) {
                listHtml = '<div class="study-note-empty">正在加载同学复盘...</div>';
            } else if (noteState.notes.length > 0) {
                listHtml = `<div class="study-note-list">${noteState.notes.map(note => {
                    const likeDisabled = note.is_own || note.liked_by_me || noteLikePending.has(note.id);
                    const likeText = note.liked_by_me ? '已点赞' : '点赞';
                    return `<div class="study-note-item">
                        <div class="study-note-meta">
                            <span class="study-note-author">${escapeHtml(note.name)} · ${escapeHtml(String(note.class_number))}班</span>
                            <span>${escapeHtml(String(note.exam_filename || '当前试卷'))} · ${new Date(note.updated_at || note.created_at).toLocaleString()}</span>
                        </div>
                        <div class="study-note-content">${escapeHtml(getStudyNoteContent(note) || '（未填写）')}</div>
                        <button type="button" class="study-note-like${note.liked_by_me ? ' liked' : ''}" onclick="likeStudyNote(${note.id})" ${likeDisabled ? 'disabled' : ''}>
                            <span>${likeText}</span>
                            <span>${Number(note.like_count || 0)} 赞</span>
                        </button>
                    </div>`;
                }).join('')}</div>`;
            }

            return `<div class="study-note-card">
                <h4>复盘与交流</h4>
                <div class="study-note-tip">${escapeHtml(encouragement)}</div>
                <div class="study-note-field">
                    <label for="studyNoteInput">我的复盘</label>
                    <textarea id="studyNoteInput" placeholder="可以写本题用到的知识点、你的答题思路，也可以指出题目、答案或解析中的错误，并说说你对这道题的评价。" oninput="updateStudyNoteDraft(this.value)">${escapeHtml(draft.content || '')}</textarea>
                </div>
                <div class="study-note-actions">
                    <div class="study-note-status">${ownNote ? `已保存，当前收到 ${Number(ownNote.like_count || 0)} 个赞。` : '提交后可继续修改你的复盘。'}</div>
                    <button type="button" id="saveStudyNoteBtn" class="btn-note-save" onclick="saveCurrentStudyNote()" ${saveDisabled ? 'disabled' : ''}>${isSavingStudyNote ? '保存中...' : (ownNote ? '更新复盘' : '保存复盘')}</button>
                </div>
                ${listHtml}
            </div>`;
        }

        async function saveCurrentStudyNote() {
            const question = questions[currentQuestionIndex];
            if (!question || isSavingStudyNote) return;

            const draft = ensureStudyNoteDraft(question);
            const content = String(draft.content || '').trim();
            if (!content) {
                alert('请先写一点你的复盘内容。');
                return;
            }

            isSavingStudyNote = true;
            renderQuestion();
            try {
                const response = await fetch(`${API_BASE}/notes`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        student_id: currentStudentId,
                        session_id: currentSessionId,
                        question_id: question.id,
                        knowledge_points: '',
                        thinking: content
                    })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.detail || 'save note failed');

                const key = getStudyNoteKey(question);
                const currentNotes = (studyNotesByQuestionText[key] && studyNotesByQuestionText[key].notes) || [];
                const others = currentNotes.filter(note => !note.is_own && note.id !== result.note.id);
                studyNotesByQuestionText[key] = {
                    loading: false,
                    loaded: true,
                    notes: [result.note, ...others]
                };
                studyNoteDrafts[key] = {
                    content: getStudyNoteContent(result.note)
                };
            } catch (error) {
                alert(error.message || '保存复盘失败，请重试');
            } finally {
                isSavingStudyNote = false;
                renderQuestion();
            }
        }

        async function likeStudyNote(noteId) {
            if (!noteId || noteLikePending.has(noteId)) return;
            noteLikePending.add(noteId);
            renderQuestion();
            try {
                const response = await fetch(`${API_BASE}/notes/${noteId}/like`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ student_id: currentStudentId })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.detail || 'like failed');

                Object.keys(studyNotesByQuestionText).forEach((key) => {
                    const state = studyNotesByQuestionText[key];
                    if (!state || !Array.isArray(state.notes)) return;
                    state.notes = state.notes.map(note => note.id === noteId
                        ? { ...note, like_count: Number(result.like_count || note.like_count || 0), liked_by_me: true }
                        : note
                    );
                });
            } catch (error) {
                alert(error.message || '点赞失败，请重试');
            } finally {
                noteLikePending.delete(noteId);
                renderQuestion();
            }
        }

        function updateSubmitButtonState(question, currentAnswerData = answers[question.id]) {
            const submitBtn = document.getElementById('submitBtn');
            if (!submitBtn || !question) return;

            if (currentAnswerData && currentAnswerData.submitted) {
                submitBtn.textContent = '已提交';
                submitBtn.disabled = true;
                return;
            }

            if (question.type === 'fill') {
                let hasAnswer = false;
                if (selectedAnswer && selectedAnswer !== '') {
                    const parts = String(selectedAnswer).split('|||');
                    hasAnswer = parts.some(p => p && p.trim() !== '');
                }
                submitBtn.textContent = hasAnswer ? '提交答案' : '请填写答案';
                submitBtn.disabled = !hasAnswer;
                return;
            }

            if (selectedAnswer === null || selectedAnswer === undefined) {
                submitBtn.textContent = '请选择答案';
                submitBtn.disabled = true;
            } else {
                submitBtn.textContent = '提交答案';
                submitBtn.disabled = false;
            }
        }

        function updateChoiceSelectionUI(question) {
            if (!question || question.type !== 'choice') return;

            const answerData = answers[question.id];
            const showFeedback = examMode !== 'exam';
            const correctIdx = parseInt(question.correct_answer);
            const buttons = document.querySelectorAll('#questionContainer .option-btn');
            buttons.forEach((button) => {
                const index = Number(button.dataset.index);
                let className = 'option-btn';
                if (answerData && answerData.submitted) {
                    if (showFeedback) {
                        if (index === correctIdx) className += ' correct';
                        else if (selectedAnswer === index) className += ' incorrect';
                    } else if (selectedAnswer === index) {
                        className += ' selected';
                    }
                } else if (selectedAnswer === index) {
                    className += ' selected';
                }
                button.className = className;
            });
            updateSubmitButtonState(question, answerData);
        }

        function renderLoadingQuestion() {
            document.getElementById('questionContainer').innerHTML = '<div class="question-card">题目加载中...</div>';
            document.getElementById('progressText').textContent = `加载中...`;
            document.getElementById('scoreText').textContent = `得分: ${totalScore.toFixed(1)}`;
            const submitBtn = document.getElementById('submitBtn');
            if (submitBtn) {
                submitBtn.textContent = '题目加载中';
                submitBtn.disabled = true;
            }
        }

        async function loadQuestionsByMode(mode, examFilename) {
            try {
                const response = await fetch(`${API_BASE}/student/practice-questions?student_id=${currentStudentId}&mode=${mode}&exam_filename=${encodeURIComponent(examFilename || '')}`);
                if (!response.ok) {
                    throw new Error('加载题目失败');
                }
                const data = await response.json();
                if (!data.questions || data.questions.length === 0) {
                    document.getElementById('questionContainer').innerHTML = '<div class="question-card">该模式下暂无题目</div>';
                    questions = [];
                    return;
                }
                questions = data.questions.map(q => ({ ...q, loaded: false, loading: false }));
                answers = {};
                draftAnswers = {};
                totalScore = 0;
                
                // 恢复之前的答题状态（如果有）
                const storedState = readActiveSessionState();
                if (storedState && storedState.session_id) {
                    // 这里可以恢复之前的答题状态
                }
                
                currentQuestionIndex = 0;
                renderQuestion();
            } catch (error) {
                console.error('加载题目失败:', error);
                document.getElementById('questionContainer').innerHTML = `<div class="question-card">加载失败: ${error.message}</div>`;
            }
        }

        function renderQuestion() {
            const question = questions[currentQuestionIndex];
            if (!question) return;
            
            if (!question.loaded) {
                fetchQuestionDetail(currentQuestionIndex);
                document.getElementById('questionContainer').innerHTML = '<div class="question-card">题目加载中...</div>';
                document.getElementById('progressText').textContent = `第 ${currentQuestionIndex + 1} / ${questions.length} 题`;
                document.getElementById('scoreText').textContent = `得分: ${totalScore.toFixed(1)}`;
                renderQuestionNavigator();
                document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
                document.getElementById('nextBtn').disabled = currentQuestionIndex === questions.length - 1;
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.textContent = '题目加载中';
                submitBtn.disabled = true;
                return;
            }
            
            // 检查收藏状态
            checkFavoriteStatus(question.id);
            prefetchNextQuestion(currentQuestionIndex);

            const container = document.getElementById('questionContainer');
            const isQuestionChanged = activeQuestionId !== question.id;
            if (isQuestionChanged) {
                const savedAnswer = answers[question.id];
                const hasDraftAnswer = Object.prototype.hasOwnProperty.call(draftAnswers, question.id);
                selectedAnswer = savedAnswer !== undefined
                    ? savedAnswer.answer
                    : (hasDraftAnswer ? draftAnswers[question.id] : null);
                startTime = Date.now();
                activeQuestionId = question.id;
            }

            let answerHtml = '';
            
            if (question.type === 'choice' && question.options && question.options.length > 0) {
                const letters = ['A', 'B', 'C', 'D', 'E', 'F'];
                const correctIdx = parseInt(question.correct_answer);
                const answerData = answers[question.id];
                const showFeedback = examMode !== 'exam';
                
                answerHtml = '<div class="options-list">' + question.options.map((opt, i) => {
                    const optionText = (opt && typeof opt === 'object') ? (opt.text ?? '') : (opt ?? '');
                    const optionImages = getOptionImages(opt);
                    const optionImagesHtml = optionImages.length > 0
                        ? `<div class="option-images">${renderImages(optionImages, 'option-image', `选项${letters[i]}图片`)}</div>`
                        : '';
                    const isSelected = selectedAnswer === i;
                    let className = 'option-btn';
                    if (answerData && answerData.submitted) {
                        if (showFeedback) {
                            if (i === correctIdx) className += ' correct';
                            else if (isSelected) className += ' incorrect';
                        } else if (isSelected) {
                            className += ' selected';
                        }
                    } else if (isSelected) className += ' selected';
                    return `<div class="${className}" data-index="${i}" onclick="selectOption(${i})"><span class="option-letter">${letters[i]}</span><span class="option-content"><span class="option-text">${escapeHtml(optionText)}</span>${optionImagesHtml}</span></div>`;
                }).join('') + '</div>';
            } else if (question.type === 'fill') {
                const fillBlanks = getFillBlanks(question);
                const blankCount = fillBlanks.length;
                const answerData = answers[question.id];
                const savedFillAnswers = answerData
                    ? String(answerData.answer ?? '').split('|||')
                    : (selectedAnswer ? String(selectedAnswer ?? '').split('|||') : []);
                const showFeedback = examMode !== 'exam';
                
                answerHtml = '<div class="fill-blanks">';
                if (blankCount === 0) {
                    answerHtml += '<div class="fill-blank-item"><span class="blank-label">(1)</span><div class="fill-blank-body"><span class="correct-answer">该题未配置标准答案，请联系教师。</span></div></div>';
                }
                for (let i = 0; i < blankCount; i++) {
                    const blankMeta = fillBlanks[i] || { answers: [], images: [], label: null };
                    const blankValue = savedFillAnswers[i] || '';
                    const isSubmitted = answerData && answerData.submitted;
                    const isCorrect = showFeedback ? isFillAnswerCorrectForBlank(blankValue, blankMeta) : false;
                    const displayCorrect = getFillBlankDisplayAnswer(blankMeta);
                    const labelHtml = blankMeta.label
                        ? `<div class="blank-extra-label">${escapeHtml(blankMeta.label)}</div>`
                        : '';
                    const blankImagesHtml = blankMeta.images && blankMeta.images.length > 0
                        ? `<div class="blank-images">${renderImages(blankMeta.images, 'blank-image', `第${i+1}空图片`)}</div>`
                        : '';
                    let inputClass = 'fill-input';
                    if (isSubmitted && showFeedback) inputClass += isCorrect ? ' correct' : ' incorrect';

                    answerHtml += `<div class="fill-blank-item"><span class="blank-label">(${i+1})</span><div class="fill-blank-body">${labelHtml}${blankImagesHtml}`;
                    if (isSubmitted) {
                        if (showFeedback) {
                            const similarity = isFillAnswerCorrectForBlank(blankValue, blankMeta);
                            const similarityPercent = Math.round(similarity * 100);
                            answerHtml += `<span class="${inputClass}">${escapeHtml(blankValue || '(未填写)')}</span><span class="correct-answer">正确答案: ${escapeHtml(displayCorrect)} (相似度: ${similarity}%)</span>`;
                        } else {
                            answerHtml += `<span class="${inputClass}">${escapeHtml(blankValue || '(未填写)')}</span>`;
                        }
                    } else {
                        answerHtml += `<input type="text" class="fill-input-field" id="fill_blank_${i}" placeholder="请输入第${i+1}个空" value="${escapeAttr(blankValue)}" oninput="handleFillInput(${i}, this.value)">`;
                    }
                    answerHtml += '</div></div>';
                }
                answerHtml += '</div>';
            }

            let explanationHtml = '';
            let currentAnswerData = answers[question.id];
            if (currentAnswerData && currentAnswerData.submitted && question.explanation && examMode !== 'exam') {
                explanationHtml = `<div class="explanation-card"><h4>💡 答案解析</h4><p>${escapeHtml(question.explanation)}</p></div>`;
            }
            const studyNotesHtml = buildStudyNotesHtml(question);

            const questionImages = getQuestionImages(question);
            const questionImagesHtml = questionImages.length > 0
                ? `<div class="question-images">${renderImages(questionImages, 'question-image', '题目图片')}</div>`
                : '';
            container.innerHTML = `<div class="question-card"><span class="question-number">${question.type==='choice'?'选择题':'填空题'} 第 ${currentQuestionIndex+1} 题 (${question.score}分)</span><button id="favoriteBtn" class="btn-small" style="float:right;" onclick="toggleFavorite()">收藏中...</button><div class="question-text">${escapeHtml(question.question)}</div>${questionImagesHtml}${answerHtml}${explanationHtml}${studyNotesHtml}</div>`;

            if (currentAnswerData && currentAnswerData.submitted && examMode === 'practice') {
                loadStudyNotesForQuestion(question);
            }

            document.getElementById('progressText').textContent = `第 ${currentQuestionIndex+1} / ${questions.length} 题`;
            document.getElementById('scoreText').textContent = `得分: ${totalScore.toFixed(1)}`;
            renderQuestionNavigator();

            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            document.getElementById('nextBtn').disabled = currentQuestionIndex === questions.length - 1;
            updateSubmitButtonState(question, currentAnswerData);
        }

        function getQuestionStatus(question) {
            const answerData = answers[question.id];
            if (!answerData || !answerData.submitted) return 'unanswered';

            const questionScore = Number(question.score) || 0;
            const answerScore = Number(answerData.score) || 0;
            if (answerScore >= questionScore - 0.0001) return 'full';
            if (answerScore > 0) return 'partial';
            return 'wrong';
        }

        function renderQuestionNavigator() {
            const navGrid = document.getElementById('questionNavGrid');
            if (!navGrid) return;

            navGrid.innerHTML = questions.map((question, index) => {
                const status = getQuestionStatus(question);
                const currentClass = index === currentQuestionIndex ? ' current' : '';
                const statusTextMap = {
                    unanswered: '未答',
                    full: '满分',
                    partial: '部分得分',
                    wrong: '零分',
                };
                const statusText = statusTextMap[status] || '未答';
                return `<button type="button" class="question-nav-btn status-${status}${currentClass}" title="第${index + 1}题 - ${statusText}" onclick="jumpToQuestion(${index})">${index + 1}</button>`;
            }).join('');
        }

        function jumpToQuestion(index) {
            if (index < 0 || index >= questions.length) return;
            currentQuestionIndex = index;
            persistActiveSessionState();
            renderQuestion();
        }

        async function checkFavoriteStatus(questionId) {
            if (!currentStudentId || !questionId) return;
            try {
                const response = await fetch(`${API_BASE}/student/favorite/status?student_id=${currentStudentId}&question_id=${questionId}&exam_filename=${encodeURIComponent(currentExamFilename || '')}`);
                const data = await response.json();
                currentFavoriteStatus = data.favorited || false;
                const btn = document.getElementById('favoriteBtn');
                if (btn) {
                    btn.textContent = currentFavoriteStatus ? '已收藏' : '收藏';
                    btn.className = currentFavoriteStatus ? 'btn-small btn-favorite favorited' : 'btn-small btn-favorite';
                }
            } catch (error) {
                console.error('检查收藏状态失败:', error);
            }
        }

        async function toggleFavorite() {
            if (!currentStudentId || currentQuestionIndex < 0 || currentQuestionIndex >= questions.length) return;
            const question = questions[currentQuestionIndex];
            if (!question) return;
            
            try {
                if (currentFavoriteStatus) {
                    // 取消收藏
                    const response = await fetch(`${API_BASE}/student/favorite?student_id=${currentStudentId}&question_id=${question.id}&exam_filename=${encodeURIComponent(currentExamFilename || '')}`, {
                        method: 'DELETE'
                    });
                    if (response.ok) {
                        currentFavoriteStatus = false;
                        const btn = document.getElementById('favoriteBtn');
                        if (btn) {
                            btn.textContent = '收藏';
                            btn.className = 'btn-small btn-favorite';
                        }
                    }
                } else {
                    // 添加收藏
                    const response = await fetch(`${API_BASE}/student/favorite`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            student_id: currentStudentId,
                            question_id: question.id,
                            exam_filename: currentExamFilename || '',
                            question_text: question.question || ''
                        })
                    });
                    if (response.ok) {
                        currentFavoriteStatus = true;
                        const btn = document.getElementById('favoriteBtn');
                        if (btn) {
                            btn.textContent = '已收藏';
                            btn.className = 'btn-small btn-favorite favorited';
                        }
                    }
                }
            } catch (error) {
                alert('操作失败: ' + error.message);
            }
        }

        function selectOption(index) {
            recordActivity();
            const question = questions[currentQuestionIndex];
            const answerData = answers[question.id];
            if (answerData && answerData.submitted) return;
            selectedAnswer = parseInt(index);
            draftAnswers[question.id] = selectedAnswer;
            persistActiveSessionState();
            updateChoiceSelectionUI(question);
        }

        function handleFillInput(blankIndex, value) {
            recordActivity();
            updateFillAnswer(blankIndex, value);
        }

        function updateFillAnswer(blankIndex, value) {
            const question = questions[currentQuestionIndex];
            const answerData = answers[question.id];
            if (answerData && answerData.submitted) return;

            const fillBlanks = getFillBlanks(question);
            const blankCount = fillBlanks.length;
            const currentAnswers = selectedAnswer ? String(selectedAnswer).split('|||') : [];
            currentAnswers[blankIndex] = value;
            while (currentAnswers.length < blankCount) currentAnswers.push('');
            selectedAnswer = currentAnswers.join('|||');
            draftAnswers[question.id] = selectedAnswer;

            const submitBtn = document.getElementById('submitBtn');
            const hasAnswer = currentAnswers.some(answer => answer && answer.trim() !== '');
            submitBtn.textContent = hasAnswer ? '提交答案' : '请填写答案';
            submitBtn.disabled = !hasAnswer;
            persistActiveSessionState();
        }

        document.getElementById('submitBtn').addEventListener('click', async function() {
            if (isSubmittingAnswer) return;

            const question = questions[currentQuestionIndex];
            recordActivity();

            if (!question) return;

            const submitBtn = document.getElementById('submitBtn');
            const previousDisabled = submitBtn.disabled;
            isSubmittingAnswer = true;
            submitBtn.disabled = true;

            try {
                if (question.type === 'fill') {
                    if (!selectedAnswer || selectedAnswer === '') return;
                    const answerTime = Math.round((Date.now() - startTime) / 1000);
                    const response = await fetch(`${API_BASE}/answers/submit`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({student_id: currentStudentId, session_id: currentSessionId, question_id: question.id, answer: selectedAnswer, answer_time: answerTime})
                    });
                    if (!response.ok) throw new Error('submit failed');
                    const result = await response.json();
                    const score = Number(result.score) || 0;
                    answers[question.id] = { answer: selectedAnswer, is_correct: result.is_correct, score, submitted: true };
                    delete draftAnswers[question.id];
                    recomputeTotalScore();
                    persistActiveSessionState();
                    renderQuestion();
                } else {
                    if (selectedAnswer === null) return;
                    const answerTime = Math.round((Date.now() - startTime) / 1000);
                    const answerValue = parseInt(selectedAnswer);
                    const response = await fetch(`${API_BASE}/answers/submit`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({student_id: currentStudentId, session_id: currentSessionId, question_id: question.id, answer: answerValue, answer_time: answerTime})
                    });
                    if (!response.ok) throw new Error('submit failed');
                    const result = await response.json();
                    const score = Number(result.score) || 0;
                    answers[question.id] = { answer: answerValue, is_correct: result.is_correct, score, submitted: true };
                    delete draftAnswers[question.id];
                    recomputeTotalScore();
                    persistActiveSessionState();
                    renderQuestion();
                }
            } catch (error) {
                submitBtn.disabled = previousDisabled;
                showSubmitFailureHint();
            } finally {
                isSubmittingAnswer = false;
            }
        });

        document.getElementById('prevBtn').addEventListener('click', function() {
            recordActivity();
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                persistActiveSessionState();
                renderQuestion();
            }
        });

        document.getElementById('nextBtn').addEventListener('click', function() {
            recordActivity();
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                persistActiveSessionState();
                renderQuestion();
            }
        });

        async function finishPractice() {
            if (isFinishingPractice) return false;
            isFinishingPractice = true;

            try {
                const response = await fetch(`${API_BASE}/sessions/${currentSessionId}/end`, {method: 'POST'});
                if (!response.ok) throw new Error('end session failed');

                const result = await response.json();
                const finalScore = Number(result.total_score);
                if (Number.isFinite(finalScore)) {
                    totalScore = finalScore;
                } else {
                    recomputeTotalScore();
                }

                isPaperSubmitted = true;
                if (examSidebarTimer) clearTimeout(examSidebarTimer);
                clearActiveSessionState();
                document.getElementById('practiceSection').classList.add('hidden');
                document.getElementById('completionSection').classList.remove('hidden');
                document.getElementById('finalScore').textContent = totalScore.toFixed(1);
                return true;
            } catch (error) {
                alert('交卷失败，请重试');
                return false;
            } finally {
                isFinishingPractice = false;
            }
        }

        document.getElementById('restartBtn').addEventListener('click', function() {
            clearActiveSessionState();
            location.reload();
        });

        // 页面加载
        window.onload = async function() {
            await loadExamMode();
            await loadExams();
            try {
                const raw = localStorage.getItem(REMEMBER_KEY);
                if (raw) {
                    const saved = JSON.parse(raw);
                    const valid = saved && saved.ts && (Date.now() - saved.ts) <= 3600 * 1000;
                    if (valid) {
                        document.getElementById('examNumber').value = saved.examNumber || '';
                        document.getElementById('studentName').value = saved.name || '';
                        document.getElementById('rememberMe').checked = true;
                    } else {
                        localStorage.removeItem(REMEMBER_KEY);
                    }
                }
            } catch (error) {
                localStorage.removeItem(REMEMBER_KEY);
            }
            document.addEventListener('click', recordActivity, true);
            document.addEventListener('keydown', recordActivity, true);
            window.addEventListener('pagehide', () => persistActiveSessionState(true));
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') {
                    persistActiveSessionState(true);
                }
            });
            await restoreActiveSession();
        };

        document.getElementById('clearRememberBtn').addEventListener('click', function() {
            localStorage.removeItem(REMEMBER_KEY);
            document.getElementById('rememberMe').checked = false;
            document.getElementById('examNumber').value = '';
            document.getElementById('studentName').value = '';
        });

        document.getElementById('handInBtn').addEventListener('click', async function() {
            if (!currentSessionId || isPaperSubmitted) return;

            const answeredCount = Object.keys(answers).length;
            const unansweredCount = questions.length - answeredCount;
            const message = unansweredCount > 0
                ? `还有 ${unansweredCount} 题未提交，确认现在交卷吗？`
                : '确认交卷吗？';

            if (confirm(message)) {
                await finishPractice();
            }
        });
    </script>
</body>
</html>
